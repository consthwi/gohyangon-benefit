const grpOf=p=>S.groups.find(g=>g.no===p.grp);
function effStat(p){ if(p.stat!=='1002') return p.stat; const n=new Date(); if(new Date(p.end)<n) return '1003'; if(new Date(p.strt)>n) return '1001'; return '1002'; }
function isFull(p){ const g=grpOf(p); return !!(g&&g.endOn&&g.limit>0&&g.count>=g.limit); }
function derive(g){
  const all=S.promos.filter(p=>p.lgvr===g.lgvr);
  const inc=all.filter(p=>!g.excl.includes(p.no));
  const live=inc.filter(p=>effStat(p)==='1002');
  const open=live.filter(p=>!isFull(p));
  const src=open.length?open:live;
  const m={};
  src.forEach(p=>p.gifts.filter(x=>x.on).forEach(x=>{ const k=(TYPE[x.t]||TYPE['9999'])[1]; m[k]=Math.max(m[k]||0,+x.amt||0); }));
  const means=KORDER.filter(k=>m[k]>0).map(k=>({k,nm:KIND[k][0],col:KIND[k][1],amt:m[k]}));
  const amt=means.reduce((a,b)=>Math.max(a,b.amt),0);
  let cap=0; src.forEach(p=>{ const G=grpOf(p); if(G&&G.endOn&&G.limit>0) cap=cap?Math.min(cap,G.limit):G.limit; });
  let state=(!S.common.use||!g.use)?'off':(open.length&&amt>0?'on':live.length?'full':'end');
  return {all,inc,live,open,means,amt,cap,state,more:amt+(+g.up||0),total:(+S.common.tax||0)+(+g.gift||0)+(+g.up||0)+amt};
}

   <tr><th>선착순 칩 <span class="tg auto">자동</span></th><td><span class="ro">${d.cap?`선착순 ${won(d.cap)}명 · 마감 시 종료`:'표시 안 함'}</span> <span class="hint">참여 제한 그룹이 「도달 시 종료」일 때만 제한 인원을 보여줍니다.</span></td></tr>

/* ───────── 화면 3. 프로모션 설정 (기존 화면 축약 재현) ───────── */
function vPromo(){ return `<h2 class="pt">프로모션 설정</h2> <span class="tg calc">기존 화면</span>
  <p class="pdesc">개발 BO에 이미 있는 화면입니다(2026-11-18 실측 8건). 프로토타입에서는 <b>맨 오른쪽 「추가혜택 노출」 열만 새로 추가</b>했습니다 — 이 프로모션이 혜택 패널에 반영되고 있는지 바로 보이게 하는 읽기 전용 칸입니다.</p>
  <table class="lt"><tr><th>우선</th><th>참여 그룹</th><th>코드</th><th>프로모션명</th><th>자치단체</th><th>채널</th><th>경품</th><th>조건</th><th>현황/제한</th><th>도달 시</th><th>기간</th><th>상태</th><th>추가혜택 노출 <span class="tg new">신규</span></th><th>관리</th></tr>

   return `<tr><td>${p.prio}</td><td>${esc(G.nm)}</td><td>${p.cd}</td><td class="l">${esc(p.nm)}</td><td>${g.nm}</td><td>${p.disp==='1001'?'기본':'조건부'}${p.inflow?`<br><small>${p.inflow}</small>`:''}</td><td>${p.gifts.filter(x=>x.on).length}개</td><td>100000원 이상 · 1회</td><td>${G.count} / ${G.endOn&&G.limit?G.limit:'-'}</td><td>${G.endOn?'종료':'유지'}</td><td><small>${p.strt.replace('T',' ')} ~<br>${p.end.replace('T',' ')}</small></td><td>${STAT[e]}</td>
   <td>${inP?stTag(d.state):'<span class="tg end">미반영</span>'}<br><a onclick="go('benefit/${g.lgvr}')" style="cursor:pointer;font-size:12px">${g.tab} 패널 ›</a></td><td><button class="btn sm" onclick="go('promo/${p.no}')">수정</button></td></tr>`; }).join('')}</table>`; }
function vPromoDetail(id){ const i=S.promos.findIndex(p=>String(p.no)===String(id)); if(i<0) return vPromo(); const p=S.promos[i], g=S.govs.find(x=>x.lgvr===p.lgvr), d=derive(g), P=`promos.${i}`, G=grpOf(p);
  PV.tab=g.lgvr; if(PV.mall!=='hub') PV.mall=g.lgvr;
  return `<h2 class="pt">프로모션 등록 / 수정</h2> <span class="tg calc">기존 화면 · 축약</span>

  <h3 class="st">기본 정보</h3>
  <table class="ft"><tr><th>프로모션명</th><td>${esc(p.nm)} <span style="color:#888">(${p.cd} · v${p.ver})</span></td></tr><tr><th>자치단체</th><td>${g.nm}</td></tr>
   <tr><th>상태</th><td><select data-p="${P}.stat">${Object.keys(STAT).map(k=>`<option value="${k}" ${p.stat===k?'selected':''}>${STAT[k]}</option>`).join('')}</select> <span class="hint">종료·준비로 바꾸면 패널 집계에서 빠집니다.</span></td></tr>
   <tr><th>기간</th><td><input type="datetime-local" data-p="${P}.strt" value="${p.strt}"> ~ <input type="datetime-local" data-p="${P}.end" value="${p.end}"></td></tr>
   <tr><th>적용 채널</th><td>${p.disp==='1001'?'기본':'조건부'} · 유입 코드 ${p.inflow||'(비움)'}</td></tr>
   <tr><th>참여 제한 그룹</th><td>${esc(G.nm)} (${G.count}명 참여 · ${G.endOn&&G.limit?'제한 '+G.limit+'명':'인원 제한 없음'}) <button class="btn sm" onclick="go('group')">그룹 설정</button></td></tr>
   <tr><th>배너 헤드라인</th><td><span style="color:#555">${esc(p.headline)||'(비움)'}</span><div class="hint">자유 입력이라 금액을 바꿔도 안 따라옵니다. <b>혜택 패널은 이 문구를 쓰지 않고 아래 경품 금액으로 계산합니다.</b></div></td></tr></table>
  <h3 class="st">연계 경품 <span style="font-weight:400;color:#666;font-size:12.5px">선택 방식 택1</span></h3>
  <table class="lt"><tr><th>순서</th><th>유형</th><th>FO 표시명</th><th>금액</th><th>연계 ID</th><th>지급 방식</th><th>사용</th><th>패널 묶음 <span class="tg calc">계산</span></th></tr>
  ${p.gifts.map((x,k)=>{ const kd=(TYPE[x.t]||TYPE['9999'])[1]; return `<tr><td>${k+1}</td><td>${TYPE[x.t][0]}</td><td>${esc(x.nm)}</td><td><input type="number" step="1000" data-p="${P}.gifts.${k}.amt" data-t="n" value="${x.amt}"></td><td>${esc(x.ext)}</td><td>${x.auto?'자동지급':'수동지급'}</td><td><input type="checkbox" data-p="${P}.gifts.${k}.on" data-t="b" ${x.on?'checked':''}></td><td><i class="dot" style="background:${KIND[kd][1]}"></i>${KIND[kd][0]}</td></tr>`; }).join('')}</table>

   <tr><th>${g.tab} 패널 현재 값</th><td>추가혜택 <b>+${won(d.amt)}원</b> · ${meansHtml(d)} · 합계 <b>${won(d.total)}원</b>${d.cap?` · 선착순 ${d.cap}명`:''}<div class="hint">같은 지자체의 진행 중 프로모션 ${d.live.length}건을 합쳐 계산한 값입니다. (상품 상세의 「연결된 기부 프로모션」 표처럼, 편집은 노출 설정 화면에서만)</div></td></tr></table>
  <div class="bar"><span></span><div class="row"><button class="btn" onclick="go('promo')">목록</button><button class="btn blue" onclick="save('저장했어요')">저장</button></div></div>`; }

/* ───────── 화면 4. 프로모션 그룹 설정 (기존 화면 축약) ───────── */
function vGroup(){ return `<h2 class="pt">프로모션 그룹 설정</h2> <span class="tg calc">기존 화면 · 축약</span>
  <p class="pdesc">같은 그룹의 프로모션은 참여 인원을 합산합니다. <b>「도달 시 종료」를 켠 그룹만</b> 혜택 패널에 「선착순 N명」 칩이 나오고, 현재 참여가 제한 인원에 닿으면 그 지자체가 「인원 마감」으로 바뀝니다. 현재 참여 칸은 실제로는 주문에서 세는 값이며, 여기서는 마감 동작을 보려고 고칠 수 있게 했습니다.</p>
  <table class="lt"><tr><th>그룹명</th><th>소속 프로모션</th><th>제한 인원</th><th>도달 시 종료</th><th>현재 참여 <small>(시연용)</small></th><th>패널 표시 <span class="tg calc">계산</span></th></tr>
  ${S.groups.map((G,i)=>`<tr><td class="l">${esc(G.nm)}</td><td>${S.promos.filter(p=>p.grp===G.no).length}건</td><td><input type="number" min="0" data-p="groups.${i}.limit" data-t="n" value="${G.limit}"></td><td><input type="checkbox" data-p="groups.${i}.endOn" data-t="b" ${G.endOn?'checked':''}></td><td><input type="number" min="0" data-p="groups.${i}.count" data-t="n" value="${G.count}"></td>
   <td>${G.endOn&&G.limit?(G.count>=G.limit?'<span class="tg full">인원 마감</span>':`선착순 ${won(G.limit)}명 칩`):'칩 없음'}</td></tr>`).join('')}</table>
  <div class="note"><b>확인 필요</b> — 개발서버 FO에는 양주 패널에 「선착순 300명」이 박혀 있지만 개발 BO 그룹 값은 <b>4명</b>(테스트 값)입니다. BO 값을 읽게 바꾸면 개발서버에서는 「선착순 4명」으로 보입니다. 운영 값(300·400)은 3자 회의 결과가 나오면 그룹 설정에 넣으면 됩니다.</div>`; }

/* ───────── 화면 5. 어디서 관리할까 ───────── */
function vPlace(){ return `<h2 class="pt">① 혜택 강조 UI를 어디서 관리할까</h2>
  <p class="pdesc">개발서버 FO에 들어간 혜택 강조 UI(카드 리본·플로팅·혜택 패널)는 지금 값이 화면 코드에 박혀 있습니다. BO 어느 메뉴에서 관리하는 게 맞는지 4가지 자리를 비교했습니다.</p>
  <table class="lt cmp"><tr><th style="width:36px"></th><th style="width:230px">자리</th><th>좋은 점</th><th>문제</th><th style="width:70px">판정</th></tr>

    <span class="cta" title="${hub?'/localGov/'+g.hub:(g.mallLink||'답례품 목록')}">${esc(c.btn)}</span>`; }
  const open=PV.open&&!!cur&&c.use;
  pv.innerHTML=`<h5>FO 미리보기 <span style="font-weight:400;font-size:11.5px;color:#666">MO · 개발서버와 같은 구성</span></h5><div class="psub">왼쪽 값을 바꾸면 바로 바뀝니다.</div>
   <div class="seg"><button class="${hub?'on':''}" data-act="pvmall" data-m="hub">허브</button>${S.govs.map(g=>`<button class="${PV.mall===g.lgvr?'on':''}" data-act="pvmall" data-m="${g.lgvr}">독립몰 ${esc(g.tab)}</button>`).join('')}<button data-act="${open?'pvclose':'pvopen'}" style="margin-left:auto">${open?'패널 닫기':'패널 열기'}</button></div>
   <div class="ph"><div class="scr"><div class="hd">${hub?'고향온':esc((pool[0]||{g:{tab:''}}).g.tab)+' 고향ON'}</div><div class="sec">${hub?'지금 많이 보는 답례품':'인기 답례품 BEST'}</div><div class="cards">${cards}</div></div>${fab}<div class="dimv ${open?'on':''}" data-act="pvclose"></div><div class="sheet ${open?'on':''}">${sheet}</div></div>
   <div class="pvnote">${!c.use?'⚠️ 공통 「기능 사용」이 꺼져 있어 리본·플로팅·패널이 모두 사라진 상태입니다.':!shown.length?'노출 중인 지자체가 없어 리본·플로팅이 사라진 상태입니다.':`플로팅: ${live.length?(live.length>1?live.length+'곳에서 더 받기':'+'+won(live[0].d.more)+'원 더 받기'):'숨김(노출 중 0곳)'} · 버튼 이동: ${cur?(hub?'/localGov/'+cur.g.hub:(cur.g.mallLink||'답례품 전체 목록')):''}`}<br><a href="../index.html?v=-1" target="_blank">↗ 같은 값으로 FO 프로토타입(v-1) 열기</a></div>`; }

/* ───────── 이벤트 ───────── */
function setPath(path,v){ const k=path.split('.'); let o=S; for(let i=0;i<k.length-1;i++) o=o[k[i]]; o[k[k.length-1]]=v; }
document.addEventListener('change',e=>{ const t=e.target, a=t.dataset.act;
  if(t.dataset.p){ let v=t.dataset.t==='b'?t.checked:t.dataset.t==='n'?Math.max(0,+t.value||0):t.value; setPath(t.dataset.p,v); save(); render(); return; }
  if(a==='excl'){ const g=S.govs[+t.dataset.i], no=+t.dataset.no; g.excl=t.checked?g.excl.filter(x=>x!==no):g.excl.concat(no); save(); render(); }
  if(a==='prod'){ const g=S.govs[+t.dataset.i], s=+t.dataset.s, v=+t.value, o=g.prods.indexOf(v); if(o>=0&&o!==s) g.prods[o]=g.prods[s]; g.prods[s]=v; save(); render(); }
});
document.addEventListener('click',e=>{ const t=e.target.closest('[data-act]'); if(!t) return; const a=t.dataset.act;
  if(a==='mv'){ const i=+t.dataset.i, j=i+(+t.dataset.d); if(j<0||j>=S.govs.length) return; const x=S.govs[i]; S.govs[i]=S.govs[j]; S.govs[j]=x; save(); render(); }
  if(a==='pv'){ PV.mall='hub'; PV.tab=t.dataset.g; PV.open=true; render(); }
  if(a==='pvmall'){ PV.mall=t.dataset.m; PV.open=true; if(PV.mall!=='hub') PV.tab=PV.mall; renderPv(); }
  if(a==='pvtab'){ PV.tab=t.dataset.g; renderPv(); }
  if(a==='pvopen'){ PV.open=true; renderPv(); }
  if(a==='pvclose'){ PV.open=false; renderPv(); }
});
render(); /* 처음 열 때는 FO 프로토타입 값을 건드리지 않는다 — 값을 바꾸거나 저장을 눌렀을 때만 반영 */
</script>
