<script>
/* =====================================================================
   고향ON BO 프로토타입 — 추가혜택 노출 설정 v0.2 (2026-11-26)
   · v0.2 = 개발자 초안(1126 · 캡쳐 3장 의견 18건) 반영: 목록 패널 · 혜택 페이지 · 색 설정 · 영수증 줄 · 자동/직접 선택
   · 프로모션 8건·그룹 3건 = 개발 BO 실측값(2026-11-18)
   · 저장소 = 브라우저 localStorage (서버 없음)
   ===================================================================== */
const KEY='ghon.benefit.bo.v2', FOKEY='ghon.benefit.fo';

  const all=S.promos.filter(p=>p.lgvr===g.lgvr), inc=all.filter(p=>!g.excl.includes(p.no));
  const live=inc.filter(p=>effStat(p)==='1002'), open=live.filter(p=>!isFull(p)), src=open.length?open:live;
  const m={}; src.forEach(p=>p.gifts.filter(x=>x.on).forEach(x=>{ const k=(TYPE[x.t]||TYPE['9999'])[1]; m[k]=Math.max(m[k]||0,+x.amt||0); }));

   localGovs:S.govs.map((g,i)=>{ const d=derive(g), ct=CAT[g.lgvr]; return {lgvrNo:g.lgvr,foLgvrNo:g.hub,sortOrder:i+1,tabName:g.tab,panelName:g.panel,pointColor:g.point||null,displayStatus:d.state.toUpperCase(),benefitSource:g.mode.toUpperCase(),autoHideYn:g.mode==='manual'?g.autoHide:true,benefitAmount:d.amt,means:d.means.map(m=>({kind:m.k,label:m.nm,amount:m.amt})),receiptRows:g.rows.map(r=>({label:r.label,amount:+r.amt,plusSignYn:r.plus,addToBadgeYn:r.ribbon})),badgeAmount:d.more,totalAmount:d.total,participantLimit:d.cap||null,listSubText:d.sub||null,
     products:g.prods.map((pi,s)=>({slot:s+1,prodNm:ct[pi][0],imgUrl:ct[pi][1]})),linkHub:g.hubLink||'/localGov/'+g.hub,linkMall:g.mallLink||null,sourcePrmtnNos:d.live.map(p=>p.no)}; })};
  return `<h2 class="pt">③ 개발 전달 사양</h2>
  <p class="pdesc">이름은 모두 가칭입니다. 아래 JSON은 지금 프로토타입에 들어 있는 값으로 실시간 생성됩니다.</p>
  <h3 class="st">새로 필요한 것</h3>
  <table class="lt cmp"><tr><th style="width:190px">구분</th><th>내용</th></tr>
   <tr><td><b>BO 메뉴 1개</b></td><td>기부관리 > 프로모션 지급 관리 > 추가혜택 노출 설정 — 탭 4개(지자체별 · 공통·색 · 허브 목록 패널 · 혜택 자세히 페이지) + 지자체 상세</td></tr>
   <tr><td><b>공통 설정 1건</b></td><td>사용·노출 요소 · 자동 열림 · 오늘 하루 보지 않기 · 지자체 바꾸는 방식 · 마감일 칩(노출·기준일·문구) · 공통 문구 · 색</td></tr>
   <tr><td><b>목록 패널 1건 · 혜택 페이지 1건</b></td><td>문구 · 기본 노출 개수 · 더 보는 방식 · 고정 개수·섞기 / 제목 · 상단 방식 · 받는 방법 3단계 · 답례품 목록 노출 · 꼭 확인하세요 · 버튼</td></tr>
   <tr><td><b>지자체별 설정</b></td><td>사용 · 순서 · 표기명 2종 · 포인트 색 · 대표 답례품 3개 · 영수증 줄 목록 · 추가혜택 값 방식(자동/직접)·직접 입력 값·자동 숨김 · 집계에서 뺄 프로모션 · 버튼 주소 2종</td></tr>
   <tr><td><b>기존 화면에 붙이는 것</b></td><td>프로모션 설정 목록·상세에 읽기 전용 「추가혜택 노출」 칸 + 바로가기</td></tr></table>
  <h3 class="st">계산 규칙</h3>
  <table class="lt cmp"><tr><th style="width:190px">값</th><th>규칙</th></tr>

   <tr><td><b>수단 · 추가혜택 금액</b></td><td>자동: 사용 중 경품을 유형 코드로 묶음(1003~1006 복지 / 1001 온누리 / 1002 네이버페이 / 9999 기타), 묶음 안 최댓값 1줄, 추가혜택 = 그중 최댓값. 직접 입력: 적은 값 그대로</td></tr>
   <tr><td><b>FO 상태</b></td><td>사용 꺼짐 → 숨김 / 집계 대상 0건 → 숨김 / 모두 인원 도달 → 인원 마감 / 그 외 노출. 직접 입력 + 자동 숨김 꺼짐이면 항상 노출</td></tr>
   <tr><td><b>카드 리본 · 합계</b></td><td>리본 = 추가혜택 + 「리본에 더함」 줄 · 합계 = 영수증 첫 줄 + 지자체 줄 전체 + 추가혜택</td></tr>

   <tr><td><b>플로팅</b></td><td>노출 중 0곳 → 숨김 / 1곳 → 「+리본금액 더 받기」 / 2곳 이상 → 「N곳에서 더 받기」</td></tr></table>
  <h3 class="st">FO가 받는 값 예시 <small>지금 설정 기준 · 실시간</small></h3>
  <pre>${esc(JSON.stringify(api,null,2))}</pre>`; }

   <div class="sum"><span>${esc(c.sumLabel)}</span><b>${won(d.total)}원</b></div><div class="fine">${br(c.fine)}</div></div>`; }
const ddChip=()=>S.common.dday?`<span class="dday">${esc(ddayTxt())} <em>D-${dday()}</em></span>`:'<span></span>';
function renderPv(){ const pv=$('pv'), c=S.common, L=S.list, P=S.page, hub=PV.mall==='hub';
  const pool=(hub?S.govs:S.govs.filter(g=>g.lgvr===PV.mall)).map(g=>({g,d:derive(g)}));
  let shown=pool.filter(x=>x.d.state==='on'||x.d.state==='full'); const live=pool.filter(x=>x.d.state==='on');
  if(hub) shown=hubOrder(shown.filter(x=>x.d.state==='on')).concat(shown.filter(x=>x.d.state==='full'));
  const listOk=hub&&L.use&&shown.length>1, pageOk=P.use;
  let view=PV.view; if(view==='list'&&!listOk) view='gov'; if(view==='page'&&!pageOk) view='gov'; if(!c.use||!shown.length) view='none';
  const cur=shown.find(x=>x.g.lgvr===PV.tab)||shown[0];
  const vars=Object.keys(c.colors).map(k=>`--${k}:${c.colors[k]}`).join(';')+(cur&&cur.g.point&&view!=='list'?`;--pt:${cur.g.point}`:'');
  const link=x=>hub?(x.g.hubLink||'/localGov/'+x.g.hub):(x.g.mallLink||'답례품 전체 목록');
  const badge=x=>c.use&&c.badge&&x.d.state==='on'?`<div class="prmtnBadge"><small>${esc(c.benefitLabel)}</small><b>+${won(x.d.more)}원</b></div>`:'';
  const cards=pool.map(x=>CAT[x.g.lgvr].slice(0,hub?1:4).map(p=>`<div class="card"><div class="im"><img src="${p[1]}" alt="">${badge(x)}</div><div class="nm">${esc(p[0])}</div><div class="lo">${esc(x.g.tab)}</div></div>`).join('')).join('');
  const fab=c.use&&c.fab&&live.length&&view!=='page'?`<div class="fab" data-act="pvfab"><div class="ball">${ENV}${live.length>1?`<em>${live.length}곳</em>`:''}</div><div class="bub"><small>${esc(c.benefitLabel)}</small><b>${live.length>1?`<em>${live.length}곳</em>에서 더 받기`:`<em>+${won(live[0].d.more)}원</em> 더 받기`}</b></div></div>`:'';
  const today=c.todayHide?`<a class="today" data-act="pvtoday">오늘 하루 보지 않기</a>`:'';
  let sheet='', body='';
  if(view==='list'){ const n=Math.max(1,+L.baseCount||1), over=shown.length>n, vis=(L.more==='toggle'&&over&&!PV.more)?shown.slice(0,n):shown;
    sheet=`<button class="x" data-act="pvclose">✕</button>${L.eyebrow?`<span class="eyeb">${esc(L.eyebrow)}</span>`:''}<div class="lhead">${br(L.head).replace('{N}',`<em>${live.length}</em>`).replace(/(<em>\d+<\/em>)곳/,(m,x)=>x.replace('</em>','곳</em>'))}</div>
     <div class="lrows ${L.more==='scroll'&&over?'scroll':''}" style="${L.more==='scroll'&&over?`max-height:${n*58}px`:''}">${vis.map(x=>`<div class="lrow ${x.d.state==='full'?'cl':''}" data-act="${x.d.state==='full'?'':'pvgov'}" data-g="${x.g.lgvr}"><span><b>${esc(x.g.panel||x.g.nm)}</b>${x.d.sub&&x.d.state==='on'?`<small>${x.d.sub}</small>`:''}</span><span class="am">${x.d.state==='full'?'마감':`+${won(x.d.more)}원<small>자세히 ›</small>`}</span></div>`).join('')}</div>
     ${L.more==='toggle'&&over?`<button class="lmore" data-act="pvmore">${PV.more?'접기':`더보기 (${shown.length-n}곳)`}</button>`:''}
     <div class="fine" style="margin-top:8px">${br(L.note)}</div>${pageOk?`<div class="btns"><span class="cta" data-act="pvpage">${esc(L.btn)}</span></div>`:''}${today}`; }
  if(view==='gov'&&cur){ const g=cur.g, d=cur.d, multi=hub&&shown.length>1;
    const govEl=multi&&c.govSwitch==='select'?`<select class="gov" data-act="pvsel">${shown.map(x=>`<option value="${x.g.lgvr}" ${x===cur?'selected':''}>${esc(x.g.panel||x.g.nm)}${x.d.state==='full'?' (마감)':''}</option>`).join('')}</select>`:`<span class="gov">${esc(g.panel||g.nm)}</span>`;
    sheet=`<button class="x" data-act="pvclose">✕</button><div class="hdr">${ddChip()}${govEl}</div>
    ${multi&&c.govSwitch==='tabs'?`<div class="tabs">${shown.map(x=>`<button class="${x===cur?'on':''}" data-act="pvtab" data-g="${x.g.lgvr}">${esc(x.g.tab)}${x.d.state==='full'?'<small>마감</small>':''}</button>`).join('')}</div>`:''}
    ${stageHtml(g)}${d.state==='full'?`<div class="closed">${br(c.closedMsg)}</div>`:rcptHtml(g,d,true)+(d.cap?`<div class="fcfs">⏱ 선착순 ${won(d.cap)}명 · 마감 시 종료</div>`:'')}
    <div class="btns"><span class="cta ${pageOk?'ghost':''}" title="${esc(link(cur))}">${esc(c.btn)}</span>${pageOk?`<span class="cta" data-act="pvpage">${esc(c.btn2)}</span>`:''}</div>${today}`; }
  if(view==='page'&&cur){ const g=cur.g, d=cur.d, pr=S.promos.filter(p=>p.lgvr===g.lgvr);
    body=`<div class="hd"><span class="bk" data-act="pvback">‹</span>${esc(P.title)}</div><div class="pg"><h1>${esc(P.title).replace('추가혜택','<em>추가혜택</em>')}</h1><div class="lead">${esc(P.lead)}</div>
     ${hub&&shown.length>1?`<div class="tabs">${shown.map(x=>`<button class="${x===cur?'on':''}" data-act="pvtab" data-g="${x.g.lgvr}">${esc(x.g.tab)}${x.d.state==='full'?'<small>마감</small>':''}</button>`).join('')}</div>`:''}
     ${d.state==='full'?`<div class="closed">${br(c.closedMsg)}</div>`:P.heroMode==='image'?`<div class="heroimg">${esc(g.tab)} 통이미지 1장<br>(지자체별 등록 · 글자·금액은 이미지에 포함)</div>`
       :`<div class="hero">${ddChip()}<h2>${br(P.heroHead).replace('{합계}',`<em>${won(d.total)}</em>`)}</h2>${stageHtml(g)}<div class="b3"><div><small>① 세액공제</small><b>100%</b></div><div><small>② 답례품</small><b>${man(g.rows[0]?g.rows[0].amt:0)}원</b></div><div class="k3"><small>③ 고향ON</small><b>추가혜택</b></div></div>${rcptHtml(g,d,false)}</div>`}
     ${d.state==='on'?`<h3>${esc(P.meansTitle)}</h3>${d.means.map(m=>`<div class="mrow" style="border-left-color:${m.col}"><span><b>${m.nm}</b><small>지급 시점·사용처 = 프로모션 연계 경품 문구</small></span><span class="a">${won(m.amt)}원</span></div>`).join('')}${d.cap?`<div class="fcfs">⏱ 선착순 ${won(d.cap)}명 · 마감 시 종료</div>`:''}
     <h3>${esc(P.howTitle)}</h3>${P.how.map((h,i)=>`<div class="how"><i>${i+1}</i><span><b>${esc(h[0])}</b><small>${esc(h[1])}</small></span></div>`).join('')}`:''}
     ${P.prodShow?`<h3>${esc(g.panel||g.nm)} 답례품</h3><div class="cards" style="padding:0">${CAT[g.lgvr].slice(0,Math.max(1,+P.prodCount||1)).map(p=>`<div class="card"><div class="im"><img src="${p[1]}" alt="">${badge(cur)}</div><div class="nm">${esc(p[0])}</div><div class="lo">100,000원 기부 시 증정</div></div>`).join('')}</div>`:''}
     <h3>${esc(P.warnTitle)}</h3><div class="warn">${P.warn.split('\n').filter(Boolean).map(l=>'· '+esc(l)).join('<br>')}</div>
     <div class="btns"><span class="cta" title="${esc(link(cur))}">${esc(P.cta).replace('{금액}',man(d.more)+'원')}</span></div></div>`; }
  if(view!=='page') body=`<div class="hd">${hub?'고향온':esc((pool[0]||{g:{tab:''}}).g.tab)+' 고향ON'}</div><div class="sec">${hub?'지금 많이 보는 답례품':'인기 답례품 BEST'}</div><div class="cards">${cards}</div>`;
  const open=view==='list'||view==='gov';
  const vb=(v,t,ok=true)=>`<button class="${view===v?'on':''}" data-act="pvview" data-v="${v}" ${ok?'':'disabled'}>${t}</button>`;
  pv.innerHTML=`<h5>FO 미리보기 <span style="font-weight:400;font-size:11.5px;color:#666">MO 기준</span></h5><div class="psub">왼쪽 값을 바꾸면 바로 바뀝니다.</div>
   <div class="seg"><button class="${hub?'on':''}" data-act="pvmall" data-m="hub">허브</button>${S.govs.map(g=>`<button class="${PV.mall===g.lgvr?'on':''}" data-act="pvmall" data-m="${g.lgvr}">독립몰 ${esc(g.tab)}</button>`).join('')}</div>
   <div class="seg">${vb('list','목록 패널',listOk&&c.use)}${vb('gov','지자체 패널',c.use&&!!shown.length)}${vb('page','혜택 페이지',pageOk&&c.use&&!!shown.length)}${vb('none','닫기')}</div>
   <div class="ph" style="${vars}"><div class="scr">${body}</div>${fab}<div class="dimv ${open?'on':''}" data-act="pvclose"></div><div class="sheet ${open?'on':''}">${sheet}</div></div>
   <div class="pvnote">${!c.use?'⚠️ 공통 「기능 사용」이 꺼져 있어 모두 사라진 상태입니다.':!shown.length?'노출 중인 지자체가 없어 리본·플로팅이 사라진 상태입니다.':`플로팅: ${live.length?(live.length>1?live.length+'곳에서 더 받기':'+'+won(live[0].d.more)+'원 더 받기'):'숨김'}${cur?` · 버튼 이동: ${esc(link(cur))}`:''}${hub&&L.shuffle?` · 오늘 순서: ${shown.map(x=>x.g.tab).join(' → ')}`:''}`}<br><a href="../fo.html" target="_blank">↗ 같은 값으로 FO 프로토타입 열기</a></div>`; }

/* ───────── 이벤트 ───────── */
function setPath(path,v){ const k=path.split('.'); let o=S; for(let i=0;i<k.length-1;i++) o=o[k[i]]; o[k[k.length-1]]=v; }
document.addEventListener('change',e=>{ const t=e.target, a=t.dataset.act;
  if(t.dataset.p){ const v=t.dataset.t==='b'?t.checked:t.dataset.t==='n'?Math.max(0,+t.value||0):t.value; setPath(t.dataset.p,v); save(); render(); return; }
  if(a==='excl'){ const g=S.govs[+t.dataset.i], no=+t.dataset.no; g.excl=t.checked?g.excl.filter(x=>x!==no):g.excl.concat(no); save(); render(); }
  if(a==='prod'){ const g=S.govs[+t.dataset.i], s=+t.dataset.s, v=+t.value, o=g.prods.indexOf(v); if(o>=0&&o!==s) g.prods[o]=g.prods[s]; g.prods[s]=v; save(); render(); }
  if(a==='pvsel'){ PV.tab=t.value; renderPv(); }
});
document.addEventListener('click',e=>{ const t=e.target.closest('[data-act]'); if(!t||t.tagName==='SELECT'||t.type==='checkbox') return; const a=t.dataset.act, gi=S.govs[+t.dataset.i];
  if(a==='mv'){ const i=+t.dataset.i, j=i+(+t.dataset.d); if(j<0||j>=S.govs.length) return; const x=S.govs[i]; S.govs[i]=S.govs[j]; S.govs[j]=x; save(); render(); }
  if(a==='rowadd'){ gi.rows.push({label:'새 줄',amt:0,plus:true,ribbon:false}); save(); render(); }
  if(a==='rowdel'){ gi.rows.splice(+t.dataset.k,1); save(); render(); }
  if(a==='rowmv'){ const k=+t.dataset.k, j=k+(+t.dataset.d); if(j<0||j>=gi.rows.length) return; const x=gi.rows[k]; gi.rows[k]=gi.rows[j]; gi.rows[j]=x; save(); render(); }
  if(a==='mancopy'){ const keep=gi.mode; gi.mode='auto'; const d=derive(gi); gi.mode=keep; KORDER.forEach(k=>gi.man[k]=0); d.means.forEach(m=>gi.man[m.k]=m.amt); save('지금 프로모션 값을 가져왔어요'); render(); }
  if(a==='ptclear'){ gi.point=''; save(); render(); }
  if(a==='colreset'){ COLORS.forEach(c=>S.common.colors[c[0]]=c[2]); save('색을 기본값으로 되돌렸어요'); render(); }
  if(a==='colone'){ const p=S.common.colors.pt; ['ddbg','ribbg','btnbg'].forEach(k=>S.common.colors[k]=p); save('마감일 칩·리본·버튼을 포인트 색으로 맞췄어요'); render(); }
  if(a==='pv'){ PV.mall='hub'; PV.tab=t.dataset.g; PV.view='gov'; render(); }
  if(a==='pvmall'){ PV.mall=t.dataset.m; PV.more=false; if(PV.mall!=='hub'){ PV.tab=PV.mall; if(PV.view==='list') PV.view='gov'; } else if(PV.view!=='page') PV.view='list'; renderPv(); }
  if(a==='pvview'){ PV.view=t.dataset.v; renderPv(); }
  if(a==='pvtab'||a==='pvgov'){ PV.tab=t.dataset.g; if(a==='pvgov') PV.view='gov'; renderPv(); }
  if(a==='pvfab'){ PV.view='list'; renderPv(); }
  if(a==='pvpage'){ PV.view='page'; renderPv(); }
  if(a==='pvback'){ PV.view='gov'; renderPv(); }
  if(a==='pvmore'){ PV.more=!PV.more; renderPv(); }
  if(a==='pvclose'){ PV.view='none'; renderPv(); }
  if(a==='pvtoday'){ PV.view='none'; renderPv(); toast('자정까지 자동 열림·플로팅을 숨겨요 (미리보기에서는 닫기만)'); }
});
render(); /* 처음 열 때는 FO 프로토타입 값을 건드리지 않는다 — 값을 바꾸거나 저장을 눌렀을 때만 반영 */
</script>
